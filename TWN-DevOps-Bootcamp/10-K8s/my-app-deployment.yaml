apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  labels:
    app: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      imagePullSecrets:
      - name: my-registry-key
      containers:
      - name: my-app
        imagePullPolicy: Always
        image: 654353650965.dkr.ecr.ca-central-1.amazonaws.com/js-app:1.1
        ports:
        - containerPort: 3000
