apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
   name: dashboard-Ingress
   namespace: kubernetes-dashboard
spec:
  rules:
  - host: dashboard.com
    http:
       paths:
          - path: /
            path Type: Prefix
            backend:
               service:
                  name: kubernetes-dashboard
                  port:
                    number: 80
